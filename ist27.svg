<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="IST27 temsilî çizim">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a323b"/>
      <stop offset=".55" stop-color="#161b21"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2229"/>
      <stop offset="1" stop-color="#0d1014"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b323a"/>
      <stop offset=".45" stop-color="#171b20"/>
      <stop offset="1" stop-color="#0c0f12"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity=".75"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tyre" cx="50%" cy="50%" r="50%">
      <stop offset=".62" stop-color="#1b2026"/>
      <stop offset=".9" stop-color="#0c0e11"/>
      <stop offset="1" stop-color="#050607"/>
    </radialGradient>
    <radialGradient id="rim" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#58626c"/>
      <stop offset="1" stop-color="#22282e"/>
    </radialGradient>
    <pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#14181c"/>
      <rect width="4" height="4" fill="#1b2026"/>
      <rect x="4" y="4" width="4" height="4" fill="#1b2026"/>
    </pattern>
    <g id="wheel">
      <circle r="62" fill="url(#tyre)"/>
      <circle r="61" fill="none" stroke="#2c333a" stroke-width="1.5"/>
      <circle r="40" fill="none" stroke="#0a0c0e" stroke-width="3"/>
      <circle r="37" fill="url(#rim)"/>
      <circle r="37" fill="none" stroke="#1fb5c4" stroke-width="2.2"/>
      <g stroke="#15191d" stroke-width="7" stroke-linecap="round">
        <line x1="0" y1="-30" x2="0" y2="-12"/><line x1="28.5" y1="-9.3" x2="11.4" y2="-3.7"/><line x1="17.6" y1="24.3" x2="7" y2="9.7"/><line x1="-17.6" y1="24.3" x2="-7" y2="9.7"/><line x1="-28.5" y1="-9.3" x2="-11.4" y2="-3.7"/>
      </g>
      <circle r="12" fill="#2d343b" stroke="#0d1013" stroke-width="2"/>
      <circle r="4.5" fill="#d64550"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect y="446" width="800" height="154" fill="url(#floor)"/>
  <line x1="0" y1="446" x2="800" y2="446" stroke="#2f3841" stroke-width="1"/>
  <g stroke="#1fb5c4" stroke-opacity=".12" stroke-width="1">
    <line x1="0" y1="470" x2="800" y2="470"/><line x1="0" y1="510" x2="800" y2="510"/><line x1="0" y1="566" x2="800" y2="566"/>
  </g>
  <ellipse cx="410" cy="448" rx="340" ry="22" fill="url(#shadow)"/>

  <!-- rear wing pylons + diffuser -->
  <path d="M128 312 L150 300 L158 392 L140 398 Z" fill="#101317"/>
  <path d="M96 410 L150 380 L250 384 L250 412 L110 420 Z" fill="url(#carbon)" stroke="#06080a" stroke-width="1.5"/>
  <path d="M100 414 L148 388" stroke="#1fb5c4" stroke-width="2"/>

  <!-- suspension (behind body) -->
  <g stroke="#3b444d" stroke-width="3.2" stroke-linecap="round">
    <line x1="200" y1="370" x2="262" y2="352"/><line x1="200" y1="390" x2="266" y2="396"/>
    <line x1="600" y1="370" x2="536" y2="350"/><line x1="600" y1="390" x2="532" y2="396"/>
  </g>
  <line x1="606" y1="368" x2="520" y2="330" stroke="#4a545e" stroke-width="2.4" stroke-linecap="round"/>

  <use href="#wheel" x="200" y="384"/>

  <!-- main roll hoop + bracing -->
  <g stroke="#3d464f" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M300 330 L316 214 Q320 204 330 206 L338 214"/>
    <line x1="318" y1="226" x2="246" y2="318"/>
  </g>
  <g stroke="#8a96a1" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M302 326 L317 216"/>
  </g>

  <!-- rear body / powertrain cover -->
  <path d="M232 400 L228 344 Q232 322 258 318 L312 314 L312 404 Z" fill="url(#body)" stroke="#06080a" stroke-width="1.5"/>
  <path d="M238 352 Q256 336 300 334" stroke="#1fb5c4" stroke-width="3" fill="none"/>

  <!-- cockpit opening, headrest, front hoop, steering -->
  <path d="M332 318 Q336 296 352 294 L452 294 Q466 296 470 310 Z" fill="#06080a"/>
  <path d="M312 318 L312 284 Q314 274 326 274 L338 276 L340 318 Z" fill="#1a1f25" stroke="#06080a" stroke-width="1.5"/>
  <path d="M452 310 L466 270 Q470 262 478 266 L486 308" stroke="#3d464f" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <line x1="438" y1="300" x2="452" y2="282" stroke="#59636d" stroke-width="4" stroke-linecap="round"/>
  <!-- driver helmet -->
  <circle cx="366" cy="292" r="22" fill="#e9f1f4"/>
  <path d="M366 270 A22 22 0 0 1 388 292 L366 292 Z" fill="#1fb5c4"/>
  <path d="M370 284 L388 284 Q390 296 384 302 L368 302 Z" fill="#0b0e12"/>
  

  <!-- sidepod -->
  <path d="M290 404 L290 336 Q292 322 308 320 L452 318 Q468 318 474 330 L492 372 L492 404 Z" fill="url(#body)" stroke="#06080a" stroke-width="1.5"/>
  <path d="M474 330 L492 372 L480 372 L462 334 Z" fill="#07090b"/>
  <path d="M298 368 L452 362 L478 344" stroke="#1fb5c4" stroke-width="4" fill="none" stroke-linejoin="round"/>
  <path d="M300 382 L446 377" stroke="#d64550" stroke-width="1.6" fill="none"/>
  <text x="318" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800" font-size="19" letter-spacing="1.5" fill="#e9f1f4">IST27</text>

  <!-- monocoque / nose -->
  <path d="M440 404 L436 330 Q438 312 460 308 L520 306 Q600 310 690 344 Q742 362 748 376 Q748 388 732 392 L620 400 L520 406 Z" fill="url(#body)" stroke="#06080a" stroke-width="1.6"/>
  <path d="M470 312 Q590 312 700 352" stroke="url(#sheen)" stroke-width="10" fill="none"/>
  <path d="M520 360 Q620 362 736 380" stroke="#1fb5c4" stroke-width="3.2" fill="none"/>
  <path d="M540 372 Q630 374 726 386" stroke="#1fb5c4" stroke-opacity=".45" stroke-width="1.6" fill="none"/>
  

  <!-- floor -->
  <path d="M250 404 L700 396 L706 410 L250 414 Z" fill="#0a0c0e"/>
  <path d="M260 412 L700 405" stroke="#1fb5c4" stroke-opacity=".7" stroke-width="1.4"/>

  <use href="#wheel" x="600" y="384"/>

  <!-- front wing -->
  <path d="M640 412 L772 404 L776 414 L644 422 Z" fill="#101317" stroke="#06080a" stroke-width="1.2"/>
  <path d="M652 398 L742 388 L746 396 L656 406 Z" fill="#171b20" stroke="#06080a" stroke-width="1.2"/>
  <path d="M664 384 L716 376 L720 382 L668 390 Z" fill="#171b20"/>
  <path d="M724 368 L786 366 L788 426 L730 428 Q722 400 724 368 Z" fill="url(#carbon)" stroke="#06080a" stroke-width="1.5"/>
  <path d="M730 428 L788 426" stroke="#1fb5c4" stroke-width="3"/>
  <path d="M724 368 L786 366" stroke="#d64550" stroke-width="1.6"/>

  <!-- rear wing -->
  <path d="M62 150 L172 146 L176 318 L70 324 Q58 240 62 150 Z" fill="url(#carbon)" stroke="#06080a" stroke-width="1.6"/>
  <path d="M62 150 L172 146" stroke="#1fb5c4" stroke-width="3"/>
  <path d="M70 324 L176 318" stroke="#1fb5c4" stroke-width="2"/>
  <g fill="#0d1013" stroke="#2e363e" stroke-width="1">
    <path d="M70 286 Q120 262 186 270 L188 282 Q124 278 72 300 Z"/>
    <path d="M78 236 Q126 212 186 220 L188 232 Q130 228 80 250 Z"/>
    <path d="M86 190 Q130 170 184 176 L186 186 Q134 184 88 202 Z"/>
  </g>
  <text x="86" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#1fb5c4">İTÜ RACING</text>

  <text x="764" y="52" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="600" letter-spacing="3" fill="#1fb5c4" fill-opacity=".9">TEMSİLÎ ÇİZİM</text>
</svg>
