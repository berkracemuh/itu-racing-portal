name: Kural yapısı kontrolü
on:
  push:
    paths: ['.github/workflows/rules-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund firebase-admin@14
      - run: |
          cat > r.mjs <<'JS'
          import {initializeApp,cert} from 'firebase-admin/app';
          import {getSecurityRules} from 'firebase-admin/security-rules';
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');initializeApp({credential:cert(sa)});
          const rs=await getSecurityRules().getFirestoreRuleset();
          const lines=rs.source[0].content.split('\n').map(l=>l.replace(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g,'<email>')).filter(l=>/match |allow |function |return /.test(l)).map(l=>l.trim().slice(0,220));
          const out=lines.join('%0A');console.log('::notice title=rules::'+out);
          JS
          node r.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
