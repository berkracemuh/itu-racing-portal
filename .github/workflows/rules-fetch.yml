name: Kural yedeği (şifreli)
on:
  push:
    paths: ['.github/workflows/rules-fetch.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund firebase-admin@14
      - run: |
          cat > r.mjs <<'JS'
          import {initializeApp,cert} from 'firebase-admin/app';
          import {getSecurityRules} from 'firebase-admin/security-rules';
          import fs from 'fs';
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');initializeApp({credential:cert(sa)});
          const rs=await getSecurityRules().getFirestoreRuleset();fs.writeFileSync('rules.txt',rs.source[0].content);
          JS
          node r.mjs
          echo "" | base64 -d > pub.pem
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in rules.txt -out r.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in k.bin -out k.enc
          echo "::notice title=k::$(base64 -w0 k.enc)"
          echo "::notice title=r::$(base64 -w0 r.enc)"
          rm -f rules.txt k.bin
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUBK: 
